name: Simple CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Step 1: Test the code
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test Client
        run: |
          cd client
          npm install
          npm run lint
          npm run build

      - name: Test Server
        run: |
          cd server
          npm install

  # Step 2: Build Docker images (only on main branch)
  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Client
        run: |
          cd client
          docker build -t ghcr.io/${{ github.repository }}-client:latest .
          docker push ghcr.io/${{ github.repository }}-client:latest

      - name: Build and Push Server
        run: |
          cd server
          docker build -t ghcr.io/${{ github.repository }}-server:latest .
          docker push ghcr.io/${{ github.repository }}-server:latest

  # Step 3: Deploy to server
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/virtumate
            docker-compose pull
            docker-compose up -d
            docker system prune -f